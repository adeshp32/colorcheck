apiVersion: apps/v1
kind: Deployment
metadata:
  name: colorcheck
  labels:
    app: colorcheck
spec:
  replicas: 1
  selector:
    matchLabels:
      app: colorcheck
  template:
    metadata:
      labels:
        app: colorcheck
    spec:
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: colorcheck:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: VCC_STORAGE_DIR
              value: /app/storage
            - name: VCC_MAX_UPLOAD_MB
              value: "250"
            - name: VCC_MAX_SOURCE_UPLOAD_MB
              value: "1024"
            - name: VCC_UPLOAD_CHUNK_MB
              value: "16"
            - name: VCC_UPLOAD_TTL_HOURS
              value: "2"
            - name: VCC_MIN_FREE_DISK_MB
              value: "4096"
            - name: VCC_MAX_QUEUED_JOBS
              value: "2"
            - name: VCC_MAX_VIDEO_SECONDS
              value: "1800"
            - name: VCC_MAX_VIDEO_MEGAPIXELS
              value: "8.3"
            - name: VCC_JOB_TTL_HOURS
              value: "6"
            - name: VCC_ANALYSES_PER_HOUR
              value: "6"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - name: job-storage
              mountPath: /app/storage
            - name: temp-storage
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 8
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: job-storage
          emptyDir: {}
        - name: temp-storage
          emptyDir: {}
