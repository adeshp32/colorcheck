[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colorcheck"
version = "0.1.0"
description = "Reference-aware video color analysis with guardrailed correction exports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "jinja2>=3.1.4",
  "numpy>=1.26.4",
  "opencv-python-headless>=4.10.0.84",
  "pillow>=10.4.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.6"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.6.0"
]

[project.scripts]
colorcheck = "colorcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"colorcheck.web" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
