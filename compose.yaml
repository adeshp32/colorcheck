name: colorcheck

services:
  app:
    build: .
    image: ${VCC_IMAGE:-colorcheck:local}
    ports:
      - "127.0.0.1:${VCC_PORT:-8000}:8000"
    environment:
      VCC_STORAGE_DIR: /app/storage
      VCC_MAX_UPLOAD_MB: ${VCC_MAX_UPLOAD_MB:-250}
      VCC_MAX_REQUEST_MB: ${VCC_MAX_REQUEST_MB:-504}
      VCC_MAX_SOURCE_UPLOAD_MB: ${VCC_MAX_SOURCE_UPLOAD_MB:-1024}
      VCC_UPLOAD_CHUNK_MB: ${VCC_UPLOAD_CHUNK_MB:-16}
      VCC_UPLOAD_TTL_HOURS: ${VCC_UPLOAD_TTL_HOURS:-2}
      VCC_MIN_FREE_DISK_MB: ${VCC_MIN_FREE_DISK_MB:-4096}
      VCC_MAX_QUEUED_JOBS: ${VCC_MAX_QUEUED_JOBS:-2}
      VCC_MAX_VIDEO_SECONDS: ${VCC_MAX_VIDEO_SECONDS:-1800}
      VCC_MAX_VIDEO_MEGAPIXELS: ${VCC_MAX_VIDEO_MEGAPIXELS:-8.3}
      VCC_JOB_TTL_HOURS: ${VCC_JOB_TTL_HOURS:-6}
      VCC_ANALYSES_PER_HOUR: ${VCC_ANALYSES_PER_HOUR:-6}
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles:
      - public
    user: "${CLOUDFLARED_UID:-1000}:${CLOUDFLARED_GID:-1000}"
    command:
      - tunnel
      - --no-autoupdate
      - --loglevel
      - info
      - run
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  cloudflare_tunnel_token:
    file: ./.secrets/cloudflare-tunnel-token
